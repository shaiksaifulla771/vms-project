    <!-- Primary Meta Tags -->
    <title>VendorOS — Enterprise Manufacturing & VMS Operations Portal</title>
    <meta name="title" content="VendorOS — Enterprise Manufacturing & VMS Operations Portal" />
    <meta name="description" content="Next-generation Vendor Management System & MRP Operations Portal for discrete manufacturing, multi-level BOM explosion, inventory netting, and supplier governance." />

    <!-- Open Graph / Facebook -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = '<div style="padding: 20px; background: #0f172a; color: #f87171; font-family: monospace; font-size: 16px; border: 1px solid #ef4444; margin: 20px; border-radius: 8px;">' +
          '<h2 style="color: #ef4444; margin-top: 0;">APPLICATION INITIALIZATION ERROR</h2>' +
          '<p><strong>Message:</strong> ' + message + '</p>' +
          '<p><strong>Source:</strong> ' + source + ':' + lineno + ':' + colno + '</p>' +
          '<pre style="background: #1e293b; padding: 12px; border-radius: 4px; overflow-x: auto;">' + (error && error.stack ? error.stack : '') + '</pre>' +
          '</div>';
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
