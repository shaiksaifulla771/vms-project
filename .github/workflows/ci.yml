name: VMS ERP CI Pipeline

on:
  push:
    branches: [ main, master, bom-hardening, security-hardening ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (frontend & backend)
        run: |
          npm run install-all

      - name: Build frontend production bundle
        run: |
          npm run build --prefix frontend

      - name: Start backend server in background
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/vms_ci_test
          PORT: 5000
          NODE_ENV: test
        run: |
          cd backend
          node server.js &
          sleep 15

      - name: Run backend automated test suite
        continue-on-error: true
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/vms_ci_test
        run: |
          npm test --prefix backend > test_logs.txt 2>&1 || true
          cat test_logs.txt
          
      - name: Commit and Push Logs
        if: always()
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          cp backend/test_logs.txt ./ || true
          git add test_logs.txt
          git commit -m "Add CI test logs [skip ci]" || true
          git push origin HEAD
